<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Model Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      display: block;
      background-color:#ffffff;
    }
  </style>
</head>
<body>
  <model-viewer
    src="models/exp17.glb"
    alt="3D model"
    camera-controls
    camera-orbit="180deg 75deg 15m"
    auto-rotate
    auto-rotate-delay="2000"
    environment-image="https://modelviewer.dev/shared-assets/environments/neutral.hdr"
    exposure="1"
    shadow-intensity="1"
    style="width:100vw; height:100vh;">
  </model-viewer>

</model-viewer>
</body>
</html>
