<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>

<!-- Add a script tag for Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>

<!-- Add a script tag for loading the 3D model -->
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
    // Set up the scene
    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    var renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Add a light source
    var light = new THREE.AmbientLight(0x404040); // Ambient light
    scene.add(light);

    // Load a 3D model (use .glb or .gltf)
    var loader = new THREE.GLTFLoader();

    loader.load('models/Dragon 2.5_fbx.gltf', function (gltf) {
        var model = gltf.scene;
        scene.add(model);

        // Calculate the bounding box of the model to adjust the camera position
        var box = new THREE.Box3().setFromObject(model);
        var size = box.getSize(new THREE.Vector3()).length();
        var center = box.getCenter(new THREE.Vector3());

        model.position.sub(center);  // Center the model

        // Adjust camera to fit the model
        camera.position.z = size * 1.5; // Adjust distance based on model size
        camera.lookAt(center);  // Make camera look at the center of the model

        // Optionally, scale the model if it's too large or small
        model.scale.set(1, 1, 1); // Change these values if the model needs resizing
    }, undefined, function (error) {
        console.error(error);
    });

    // Set up animation loop
    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();

    // Handle window resizing
    window.addEventListener('resize', function () {
        renderer.setSize(window.innerWidth, window.innerHeight);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
    });
</script>

</body>
</html>
